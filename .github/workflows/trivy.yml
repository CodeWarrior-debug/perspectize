name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "frontend/pnpm-lock.yaml"
      - "backend/go.sum"
      - ".github/workflows/trivy.yml"
  pull_request:
    paths:
      - "frontend/pnpm-lock.yaml"
      - "backend/go.sum"
      - ".github/workflows/trivy.yml"

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gating scan: table format prints findings directly in the log AND
      # respects the severity filter for exit-code (HIGH,CRITICAL only).
      - name: Run Trivy scan (table — gates the build, visible in log)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      # Upload-only scan: never fails the build. The trivy-action builds SARIF
      # "with all severities" and would otherwise trip exit-code on LOW/MEDIUM
      # findings, so we set exit-code 0 here and gate on the table step above.
      # limit-severities-for-sarif keeps the Security tab scoped to HIGH,CRITICAL.
      - name: Run Trivy scan (SARIF — for GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: 0
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
