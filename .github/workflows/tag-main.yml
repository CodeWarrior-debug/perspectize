name: Tag main

# Runs after CI succeeds on a push to main, and pushes a deterministic
# version tag for that commit: v<committer-date-UTC>-<short7sha>.
#
# This is "tag once CI passes", not "tag on deploy" — Sevalla (not GitHub
# Actions) does the actual deploys, and there's no deploy webhook wired up
# yet. See the PR that introduced this workflow for the reasoning.
#
# The tag format must stay in sync with:
#   - backend/internal/core/domain/buildinfo.go (ComputeTag)
#   - frontend/src/lib/utils/buildTag.ts (computeTag)
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    name: Tag commit
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Compute tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          COMMITTER_DATE="$(git show -s --format=%cI "$SHA")"
          DATE_PART="$(date -u -d "$COMMITTER_DATE" +%Y.%m.%d)"
          TAG="v${DATE_PART}-${SHORT_SHA}"
          echo "Computed tag: $TAG for $SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Push tag if new
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — nothing to do (idempotent rerun)."
            exit 0
          fi
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed tag $TAG -> $SHA"
