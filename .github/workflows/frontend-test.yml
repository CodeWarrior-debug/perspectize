name: Frontend Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm run test:coverage

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser-mode tests
        working-directory: frontend
        env:
          SV_SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
        # Separate results file, or it overwrites the unit run's (vite.config.ts).
        run: pnpm run test:browser --browser.headless=true --outputFile.json=./test-results/vitest-browser-results.json

      # Every failing test file in one place, so a second failure under load
      # doesn't scroll off the log (#728). Runs even when a test step failed.
      - name: List failed test files
        if: always()
        working-directory: frontend
        run: |
          shopt -s nullglob
          files=(test-results/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No result files written."; exit 0; fi
          {
            echo "### Failed test files"
            jq -r '.testResults[] | select(.status == "failed") | "- `\(.name | sub(".*/frontend/"; ""))`"' "${files[@]}" | sort -u
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.testResults[] | select(.status == "failed") | .name' "${files[@]}" | sort -u

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vitest-results
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
