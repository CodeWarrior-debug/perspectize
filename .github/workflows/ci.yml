name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        # -p 1 serializes package test binaries: several integration tests
        # (test/repositories, test/services) share one Postgres service
        # container with no per-package isolation, and RetentionSweeper.
        # SweepOnce prunes messages across *all* threads — running packages
        # concurrently lets one package's in-flight message inserts get
        # swept mid-test by another package's retention test, producing
        # flaky counts (see PR #384 CI failure: "deleted = 624, want 20").
        run: go test -p 1 -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build -v ./...

      - name: Verify formatting
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'make fmt'"
            exit 1
          fi

  ai-tooling:
    name: AI Tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-tooling

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ai-tooling/go.mod
          cache-dependency-path: ai-tooling/go.sum

      - name: Build
        run: go build -v ./...

      - name: Verify formatting
        run: |
          gofmt -l .
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .' in ai-tooling/"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Includes TestEmbeddedGuideIsClean, which lints the app guide and checks
      # every Source path against the checked-out frontend/.
      - name: Run tests
        run: go test -race ./...

  # Builds the production image the way Sevalla does: repo-root context,
  # backend/Dockerfile. Catches context/COPY mistakes before a deploy does,
  # and asserts the root .dockerignore keeps secrets and frontend/ out.
  docker-image:
    name: Docker Image (repo-root context)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Plant decoy secret files so the ignore rules are actually exercised.
      - name: Plant decoy secret files
        run: |
          echo "DECOY=1" > backend/.env
          echo "DECOY=1" > ai-tooling/.env.local
          echo "DECOY=1" > .env

      - name: Build builder stage
        run: docker build -f backend/Dockerfile --target builder -t perspectize-builder .

      - name: Assert build context excludes secrets and frontend
        run: |
          leaks=$(docker run --rm perspectize-builder sh -c 'find /app -name ".env*" -o -path "/app/frontend" | head -20')
          if [ -n "$leaks" ]; then
            echo "Build context leaked files into the image build stage:"
            echo "$leaks"
            exit 1
          fi

      - name: Build final image
        run: docker build -f backend/Dockerfile -t perspectize-backend .

  demo-e2e:
    # Runs the demo tours + flows (frontend/demo/) as Playwright E2E against a
    # freshly seeded DEMO_MODE stack — multi-user auth, privacy and the add-video
    # flow with no Clerk or YouTube credentials.
    name: Demo E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: perspectize_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://demo:demo@localhost:5432/perspectize_demo?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Migrate and seed demo data
        working-directory: backend
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up
          go run ./cmd/seed-demo

      - name: Start backend (DEMO_MODE)
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/server" ./cmd/server
          DEMO_MODE=true nohup "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &

      - name: Build and serve demo frontend
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
          VITE_GRAPHQL_URL: http://localhost:8080/graphql
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          nohup pnpm exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for stack
        run: |
          for url in http://localhost:8080/ready http://localhost:4173/; do
            timeout 60 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done

      - name: Run demo tours and flows
        working-directory: frontend
        env:
          DEMO_BASE_URL: http://localhost:4173
          DEMO_GRAPHQL_URL: http://localhost:8080/graphql
        run: pnpm run demo:test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-e2e-report
          path: |
            frontend/demo/out/
            ${{ runner.temp }}/*.log
