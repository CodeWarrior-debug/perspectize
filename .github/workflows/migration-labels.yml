name: Migration labels

# Keeps `migrations-unapplied` and `check-migration-number-before-apply` in
# sync on every open PR (rules: .docs/PR_WORKFLOW.md → "Migration labels").
# No AI, no secrets: plain JavaScript with the run's own GITHUB_TOKEN.
# `migrations-applied` stays manual — only a human knows `migrate up` ran.

on:
  # pull_request_target so the token can label PRs from forks too. Safe here:
  # nothing from the PR is checked out or executed — the script reads the PR's
  # file list through the API and runs from the base branch.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # A migration landing on main changes the next free number, so every other
  # open PR is re-checked.
  push:
    branches: [main]
    paths: ['backend/migrations/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: migration-labels
  cancel-in-progress: false

jobs:
  label:
    name: Sync migration labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Sync labels on all open PRs
        uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/migration-labels.js');
            await run({ github, context, core });
