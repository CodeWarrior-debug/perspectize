<script>
const S = SPEC;
const ICONS = {
  food:'<path d="M12 7c-1.5-2-5-2.5-6.5 0S4 14 6 17.5 10 21 12 20c2 1 4 1 6-2.5S20.5 9.5 18.5 7 13.5 5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M12 6v8M9 9h6"/>',
  film:'<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  tv:'<rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  quote:'<path d="M3 21c3 0 7-1 7-8V5c0-1.25-.76-2-1.9-2H5c-1.2 0-2 .75-2 1.97V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.76-2-1.9-2h-3.1c-1.2 0-2 .75-2 1.97V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.file}</svg>`;
const DASH = '<span class="dash">—</span>';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const val = c => (c && typeof c === 'object' && !Array.isArray(c)) ? c.value : c;
const isEmpty = c => c == null || val(c) == null || val(c) === '' || (Array.isArray(val(c)) && val(c).length === 0);

document.getElementById('typeLabel').textContent = S.type.label;
document.getElementById('count').textContent = `${S.rows.length} items`;
document.getElementById('stamp').textContent = `Throwaway preview · ${S.meta.date}`;
document.getElementById('note').innerHTML = `<b>What you are looking at.</b> The Activity table with only <b>${esc(S.type.label)}</b> filtered in, so the Type column is hidden and every header uses the type's own label. Hover a header or a cell for its tooltip. Click a title (or the ✎) to open the details and Add‑perspective views. Nothing here is wired to the app.${S.meta.note?` ${esc(S.meta.note)}`:''}`;

// ---- cell renderers by column.kind ----
const R = {
  perspectize: (c,row) => `<span class="pz ${row.hasPerspective?'has':''}" data-open="${row.id}" data-view="persp">✎</span>`,
  item: (c,row) => { const v=c||{}; const th = v.thumb ? `<span class="tile ${v.thumbShape==='poster'?'poster':''}"><img src="${esc(v.thumb)}" alt=""></span>` : `<span class="tile">${icon(S.type.icon)}</span>`;
    const t = v.title ?? '—', sub = v.sub || null;
    return `<div class="item">${th}<div><div class="t ${S.type.serifTitles===false?'sans':''}" data-open="${row.id}">${esc(t)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div></div>`; },
  pill: c => isEmpty(c) ? DASH : `<span class="pill">${esc(val(c))}</span>${c.suffix?`<span class="suffix">${esc(c.suffix)}</span>`:''}`,
  text: c => isEmpty(c) ? DASH : `${esc(val(c))}${c.flag?`<span class="flag">${esc(c.flag)}</span>`:''}`,
  num:  c => isEmpty(c) ? DASH : Number(val(c)).toLocaleString(),
  tags: c => isEmpty(c) ? DASH : `<div class="tagwrap">${val(c).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`,
  date: c => isEmpty(c) ? DASH : esc(val(c)),
};
const CLS = {perspectize:'c', num:'num'};

const hdr=document.getElementById('hdr'), rows=document.getElementById('rows');
S.columns.forEach((col,i)=>{ const th=document.createElement('th'); th.className=CLS[col.kind]||''; th.dataset.col=i;
  th.innerHTML = `${esc(col.label||'')}${col.unit?` <span style="color:var(--muted-fg);font-weight:400">(${esc(col.unit)})</span>`:''}${col.label?`<span class="st badge ${col.status}">${col.status}</span>`:''}`; hdr.appendChild(th); });
S.rows.forEach(row=>{ const tr=document.createElement('tr'); tr.dataset.id=row.id;
  S.columns.forEach((col,i)=>{ const td=document.createElement('td'); td.className=CLS[col.kind]||''; td.dataset.col=i; td.dataset.id=row.id;
    td.innerHTML=(R[col.kind]||R.text)(row.cells[col.id], row); tr.appendChild(td); });
  rows.appendChild(tr); });

// ---- tooltips ----
const pop=document.getElementById('pop');
function showPop(html,x,y){ pop.innerHTML=html; pop.style.display='block'; const r=pop.getBoundingClientRect();
  let l=x+14,t=y+14; if(l+r.width>innerWidth-8)l=x-r.width-10; if(t+r.height>innerHeight-8)t=y-r.height-10; pop.style.left=l+'px'; pop.style.top=t+'px'; }
const hidePop=()=>pop.style.display='none';
const TIPS=[]; const tipRef=h=>h?String(TIPS.push(h)-1):'';
function tipHtml(t,status){ return `<div class="h">${t.h||''}${status?` <span class="badge ${status}">${status}</span>`:''}</div>${t.v?`<div class="v">${t.v}</div>`:''}${t.body?`<div>${t.body}</div>`:''}<div class="m">${t.src?`<code>${esc(t.src)}</code>`:''}${t.extra?`<div style="margin-top:4px">${t.extra}</div>`:''}</div>`; }
function cellTip(col,row){ const c=row.cells[col.id]; const t=(c&&typeof c==='object'&&c.tip)||{};
  if(col.kind==='item'){ const v=c||{}; return {h:col.label, v:esc(v.title+(v.sub?' — '+v.sub:'')), src:t.src||col.header.src, extra:t.extra}; }
  const v = t.v ?? (isEmpty(c) ? (t.empty||'Not set') : (col.kind==='tags'? val(c).map(x=>`☐ ${esc(x)}`).join('<br>') : esc(String(val(c)))+(c.suffix?` ${esc(c.suffix)}`:'')));
  return {h:t.h||col.label, v, src:t.src||col.cell?.src, extra:t.extra||(isEmpty(c)?(t.empty?undefined:col.cell?.whenEmpty):col.cell?.extra)}; }
document.addEventListener('mousemove',e=>{
  const el=e.target.closest('[data-tip]')||e.target.closest('th[data-col],td[data-col]');
  if(!el){hidePop();return;}
  if(el.dataset.tip){showPop(TIPS[+el.dataset.tip],e.clientX,e.clientY);return;}
  const col=S.columns[el.dataset.col];
  if(el.tagName==='TH'){showPop(tipHtml({h:col.label||col.header.h,body:col.header.body,src:col.header.src,extra:col.header.extra},col.status),e.clientX,e.clientY);return;}
  showPop(tipHtml(cellTip(col,S.rows.find(r=>String(r.id)===el.dataset.id)),col.status),e.clientX,e.clientY);
});

// ---- details + perspective modal ----
const ov=document.getElementById('ov'), modal=document.getElementById('modal');
let cur=null, view='details', ext={mode:'choose',pick:null,text:''}, ratings={}, priv=false;
(S.perspective.ratings||['Quality','Agreement','Importance','Confidence']).forEach((r,i)=>ratings[r]=[7,8,9,6][i%4]);
const tile = t => `<div class="tl" data-tip="${tipRef(esc(t.tip||''))}"><div class="k"><span>${esc(t.k)}</span>${t.status?`<span class="badge ${t.status}">${t.status}</span>`:''}</div><div class="v">${t.v==null||t.v===''?`<span class="dash">—</span>${t.empty?` <small>${esc(t.empty)}</small>`:''}`:esc(t.v)}${t.sub?` <small>${esc(t.sub)}</small>`:''}</div></div>`;
function openModal(id,v){ cur=S.rows.find(r=>String(r.id)===String(id)); view=v||'details';
  document.querySelectorAll('tr.open').forEach(t=>t.classList.remove('open')); document.querySelector(`tr[data-id="${id}"]`).classList.add('open'); render(); ov.classList.add('show'); }
function closeModal(){ ov.classList.remove('show'); document.querySelectorAll('tr.open').forEach(t=>t.classList.remove('open')); }
function render(){
  const row=cur, d=row.details, i=S.rows.indexOf(row), P=S.perspective, E=P.extension;
  const textHtml = (d.text||[]).map(([n,t])=> n==null ? `<div class="empty">${esc(t)}</div>` : `<div><sup>${esc(n)}</sup>${esc(t)}</div>`).join('');
  const pos = d.position;
  const details = `<div class="mb"><div>
    ${d.media?`<img class="media" src="${esc(d.media)}" alt="">`:''}
    ${textHtml?`<div class="sec"><h4>${esc(d.textLabel||'Text')} ${d.textStatus?`<span class="badge ${d.textStatus}">${d.textStatus}</span>`:''}</h4><div class="text ${S.type.serifText===false?'sans':''}">${textHtml}</div></div>`:''}
    ${pos?`<div class="sec"><h4>${esc(pos.label)} ${pos.status?`<span class="badge ${pos.status}">${pos.status}</span>`:''}</h4><div class="bar" data-tip="${tipRef(esc(pos.tip||''))}">${(pos.markers||[]).map(m=>`<span class="mk" style="left:${m}%"></span>`).join('')}<span class="seg" style="left:${pos.left}%;width:${pos.width}%"></span></div><div class="bar-lbl">${(pos.labels||[]).map(l=>`<span>${esc(l)}</span>`).join('')}</div></div>`:''}
    ${(d.links||[]).map(g=>`<div class="sec links"><h4>${esc(g.label)} ${g.status?`<span class="badge ${g.status}">${g.status}</span>`:''}</h4>${g.picker?`<div>${esc(g.picker.label)}: <select>${g.picker.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select> <a href="#" onclick="return false">${esc(g.picker.link)} ↗</a> ${g.picker.note?`<span style="color:var(--muted-fg);font-size:11px">(${esc(g.picker.note)})</span>`:''}</div>`:''}${g.items?`<ul>${g.items.map(x=>`<li><a href="#" onclick="return false">${esc(x)}</a></li>`).join('')}</ul>`:''}</div>`).join('')}
   </div><div>
    <div class="sec"><h4>Key facts</h4><div class="tiles">${(d.tiles||[]).map(tile).join('')}</div></div>
    ${d.tags?`<div class="sec"><h4>Tags ${d.tagsStatus?`<span class="badge ${d.tagsStatus}">${d.tagsStatus}</span>`:''}</h4><div class="tagwrap">${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`:''}
    <div class="sec"><h4>Perspectives</h4>${row.hasPerspective?`<div>Yours · ${Object.entries(ratings).slice(0,2).map(([k,v])=>`${k} ${v}`).join(' · ')} <a href="#" onclick="return false" style="color:var(--primary)">edit</a></div><div style="color:var(--muted-fg)">${d.otherPerspectives??2} others</div>`:`<div class="empty">None yet.</div>`}</div>
   </div></div>`;
  const persp = `<div class="persp">
    <h3>Add perspective <span class="badge shipped">shipped</span> <span style="font-weight:400;color:var(--muted-fg)">on <span class="serif">${esc(d.title)}${d.subtitle?' · '+esc(d.subtitle):''}</span></span></h3>
    ${Object.entries(ratings).map(([k,v])=>`<div class="rating"><label>${esc(k)}</label><button data-r="${esc(k)}" data-d="-1">−</button><div class="track"><i style="width:${v*10}%"></i></div><button data-r="${esc(k)}" data-d="1">+</button><span class="n">${v}</span><button class="x" title="Remove field">×</button></div>`).join('')}
    <div class="addf">+ Add a field — e.g. ${esc(P.addFieldHint||'clarity')}</div>
    ${E?`<div class="ext"><div class="hd"><b>${esc(E.label)}</b> ${E.badge?`<span class="badge ${E.status||'proposed'}" data-tip="${tipRef(esc(E.tip||''))}">${esc(E.badge)}</span>`:''}
      ${E.freeText?`<span class="seg2"><button class="${ext.mode==='choose'?'on':''}" data-hm="choose">Choose</button><button class="${ext.mode==='own'?'on':''}" data-hm="own">${esc(E.freeText.label||'In my own words')}</button></span>`:''}</div>
      ${ext.mode==='choose'||!E.freeText?`<div class="opts">${E.options.map(h=>`<button class="${ext.pick===h?'on':''}" data-hp="${esc(h)}">${esc(h)}</button>`).join('')}</div>`:`<input type="text" id="exttext" placeholder="${esc(E.freeText.placeholder||'')}" value="${esc(ext.text)}">`}
      </div>`:''}
    <textarea rows="3" placeholder="Comment (optional)"></textarea>
    <div class="row"><span class="sw ${priv?'on':''}" id="priv"><i></i> Private</span><span><button class="btn" id="back">Back to details</button> <button class="btn pri">Save perspective</button></span></div>
   </div>`;
  modal.innerHTML = `<div class="mh"><div><div class="k">${esc(S.type.label)} · Content details</div><div class="ttl ${S.type.serifTitles===false?'sans':''}">${esc(d.title)}</div>${d.subtitle?`<div class="sub serif">${esc(d.subtitle)}</div>`:''}</div>
    <div style="display:flex;gap:6px"><button class="pri" id="addp">${row.hasPerspective?'Edit':'Add'} perspective</button><button id="close">Close</button></div></div>
    ${details}${view==='persp'?persp:''}
    <div class="ctrl"><button id="prev" ${i===0?'disabled':''}>← ${i>0?esc(S.rows[i-1].details.title):''}</button><span>${i+1} of ${S.rows.length}${d.footer?' · '+esc(d.footer):''}</span><button id="next" ${i===S.rows.length-1?'disabled':''}>${i<S.rows.length-1?esc(S.rows[i+1].details.title):''} →</button></div>`;
  modal.querySelector('#close').onclick=closeModal;
  modal.querySelector('#addp').onclick=()=>{view='persp';render();modal.querySelector('.persp').scrollIntoView({behavior:'smooth'});};
  modal.querySelector('#prev').onclick=()=>{if(i>0)openModal(S.rows[i-1].id,view)};
  modal.querySelector('#next').onclick=()=>{if(i<S.rows.length-1)openModal(S.rows[i+1].id,view)};
  modal.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratings[b.dataset.r]=Math.min(10,Math.max(1,ratings[b.dataset.r]+ +b.dataset.d));render();});
  modal.querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{ext.mode=b.dataset.hm;render();});
  modal.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{ext.pick=ext.pick===b.dataset.hp?null:b.dataset.hp;render();});
  const et=modal.querySelector('#exttext'); if(et) et.oninput=e=>ext.text=e.target.value;
  const pv=modal.querySelector('#priv'); if(pv) pv.onclick=()=>{priv=!priv;render();};
  const bk=modal.querySelector('#back'); if(bk) bk.onclick=()=>{view='details';render();};
}
document.addEventListener('click',e=>{ const o=e.target.closest('[data-open]'); if(o){openModal(o.dataset.open,o.dataset.view||'details');return;} if(e.target===ov)closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
</script>
</body>
</html>
