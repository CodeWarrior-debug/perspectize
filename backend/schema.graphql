  contentId: IntID!
  qid: String!
  label: String!
  description: String
  entityType: String
}

input CreateClaimInput {
  text: String!            # The claim text (may contain @this/@here tokens)
  userID: IntID!           # Who created the claim
  parentContentID: IntID!  # The content item this claim is about
}

# --- Import staging (bulk import from channels and filmographies) ---
# Admins create an import of one or more sources; each is listed in the
# background into candidate rows that signed-in users pick and import.
# Spec: docs/superpowers/specs/2026-10-27-youtube-channel-import-design.md

enum ImportSourceType {
  # A YouTube channel's uploads; rows become YOUTUBE_VIDEO content.
  YOUTUBE_CHANNEL
  # A TMDB person's filmography; rows become MOVIE content.
  TMDB_PERSON
}

enum ImportPersonRole {
  DIRECTOR
  CAST
}

enum ImportSourceStatus {
  # Part of a request nobody has approved yet: nothing is listed.
  WAITING
  LISTING
  READY
  FAILED
}

enum ImportItemKind {
  VIDEO
  SHORT
  LIVE
  MOVIE
}

enum ImportItemStatus {
  QUEUED
  IMPORTED
  # The content already existed, so nothing new was created.
  SKIPPED
  FAILED
}

type ImportSource {
  id: ID!
  sourceType: ImportSourceType!
  # As entered: a channel id, handle or URL; a TMDB person id or URL.
  sourceRef: String!
  title: String
  url: String
  role: ImportPersonRole
  # The content type every row of this source becomes.
  destinationType: ContentType!
  status: ImportSourceStatus!
  # Why listing failed or stopped early; null while listing or when ready.
  statusDetail: String
  # Rows staged so far.
  itemCount: Int!
  # When listing finished (ISO); the row stats are a snapshot from then.
  fetchedAt: String
}

# An admin's import is APPROVED when created; anyone else's is REQUESTED until
# an admin approves it (listing starts) or declines it.
enum ImportRequestStatus {
  REQUESTED
  APPROVED
  DECLINED
}

type ImportJob {
  id: ID!
  name: String!
  requestStatus: ImportRequestStatus!
  # Who created it (the requester, for a request).
  requestedBy: User
  # The reviewing admin's reason; always set on a decline.
  reviewNote: String
  reviewedAt: String
  # Set when an admin closed it: hidden from non-admins and read-only.
  closedAt: String
  sources: [ImportSource!]!
  createdAt: String!
  updatedAt: String!
  # Every staged row, in listing order. One query, whatever the count.
  items: [ImportItem!]!
}

# One candidate row: what it is, how big, how current, how well received.
# Long text (description, chapters, tags) is on importItemDetails.
type ImportItem {
  id: ID!
  sourceId: ID!
  destinationType: ContentType!
  kind: ImportItemKind!
  # YouTube video id or TMDB movie id.
  externalId: String!
  url: String!
  title: String!
  # First meaningful description line, with channel boilerplate removed.
  summary: String
  publishedAt: String
  durationSeconds: Int
  viewCount: Float
  # Null when the channel hides likes (never 0 for unknown).
  likeCount: Float
  commentCount: Float
  # 0-10, how many ratings it rests on, and whose (e.g. "TMDB").
  rating: Float
  ratingCount: Int
  ratingSource: String
  chapterCount: Int!
  hasCaptions: Boolean
  # Films: genre names and up to 3 top-billed cast (empty for videos).
  genres: [String!]!
  topCast: [String!]!
  # Films (TMDB): daily popularity score, user review count, and box office
  # takings and budget in USD. Null when unknown.
  popularity: Float
  reviewCount: Int
  revenue: Float
  budget: Float
  thumbnailUrl: String
  # Marked "don't import" (by anyone, until the import is closed): can't be imported.
  excluded: Boolean!
  # Position in the source listing; 0 is first (newest for channels).
  position: Int!
  statsFetchedAt: String!
  # True when content with this URL is already in the library.
  inLibrary: Boolean!
  # The content this row became, or the existing content with the same URL.
  contentId: ID
  # Null until someone imports it.
  importStatus: ImportItemStatus
  importError: String
  importedAt: String
}

type ImportChapter {
  startSeconds: Int!
  title: String!
}

type ImportPerson {
  name: String!
  role: String!
}

type ImportItemDetails {
  item: ImportItem!
  description: String!
  tags: [String!]!
  chapters: [ImportChapter!]!
  # Outbound link domains, e.g. "gty.org".
  links: [String!]!
  people: [ImportPerson!]!
  genres: [String!]!
  language: String
}

input CreateImportSourceInput {
  sourceType: ImportSourceType!
  ref: String!
  role: ImportPersonRole
}

input CreateImportJobInput {
  name: String!
  sources: [CreateImportSourceInput!]!
}

# Live progress of an import's running batch(es), pushed at most twice a
# second while rows import. done = imported + skipped + failed.
type ImportProgress {
  jobId: ID!
  total: Int!
  done: Int!
  imported: Int!
  # Already in the library, so nothing new was created.
  skipped: Int!
  failed: Int!
  running: Boolean!
  updatedAt: String!
}

extend type Subscription {
  # The current count at once, then every change while the import runs.
  importProgress(jobId: ID!): ImportProgress! @auth
}

input ReviewImportJobInput {
  jobId: IntID!
  approve: Boolean!
  # Required to decline: it is what the requester reads.
  note: String
}

input SetImportItemsExcludedInput {
  jobId: IntID!
  itemIds: [IntID!]!
  # true marks the rows "don't import"; false clears the mark.
  excluded: Boolean!
}

input CloseImportJobInput {
  jobId: IntID!
  # false reopens it.
  closed: Boolean!
}

input ImportItemsInput {
  jobId: IntID!
  itemIds: [IntID!]!
}

type ImportItemsResult {
  queued: Int!
  alreadyInLibrary: Int!
  alreadyQueued: Int!
  notFound: Int!
  # Marked "don't import", so not queued.
  excluded: Int!
}

type Mutation {
  createContentFromYouTube(input: CreateContentFromYouTubeInput!): CreateContentResult! @auth
  updateContentSourceData(contentId: IntID!): Content! @auth

  # Movie mutations
  createContentFromMovie(input: CreateContentFromMovieInput!): Content! @auth

  # Bible passage mutations
  createContentFromPassage(input: CreateContentFromPassageInput!): Content! @auth
  # First-write-wins: if a title already exists, returns the content with the existing title.
  setPassageDisplayTitle(input: SetPassageDisplayTitleInput!): Content! @auth
  # Admin only: resets the title so it can be set again.
  clearPassageDisplayTitle(contentId: IntID!): Content! @auth

  # User mutations
  createUser(input: CreateUserInput!): User! @auth
  updateUser(input: UpdateUserInput!): User! @auth
  deleteUser(id: ID!): Boolean! @auth

  # Onboarding (authenticated owner only — no client userId)
  markOnboardingSeen(version: Int!): UserOnboarding! @auth
  setOnboardingDisplayNextSession(displayNextSession: Boolean!): UserOnboarding! @auth

  # Perspective mutations
  createPerspective(input: CreatePerspectiveInput!): Perspective! @auth
  # Ownership is enforced in PerspectiveService.Update + an owner-scoped UPDATE
  # (see the resolver), not @owner: that saved a duplicate row read per save.
  updatePerspective(input: UpdatePerspectiveInput!): Perspective! @auth
  # Ownership: PerspectiveService.Delete + an owner-scoped DELETE, not @owner
  # (see updatePerspective).
  deletePerspective(id: ID!): Boolean! @auth

  # Claim mutations
  createClaim(input: CreateClaimInput!): Content! @auth

  # Category mutations
  setPrimaryCategory(input: SetPrimaryCategoryInput!): Content! @auth

  # User todo ("Plan") mutations. Ownership is enforced in UserTodoService and
  # the owner-scoped SQL under it, not by @owner; the actor is the session user.
  createUserTodo(input: CreateUserTodoInput!): UserTodo! @auth
  updateUserTodo(input: UpdateUserTodoInput!): UserTodo! @auth
  deleteUserTodo(id: ID!): Boolean! @auth
  createTodoAction(input: CreateTodoActionInput!): TodoAction! @auth
  createUserTodoList(input: CreateUserTodoListInput!): UserTodoList! @auth
  updateUserTodoList(input: UpdateUserTodoListInput!): UserTodoList! @auth
  deleteUserTodoList(id: ID!): Boolean! @auth
  # Rewrites the list's positions to 1..N in the order of todoIds.
  reorderUserTodoList(listId: IntID!, todoIds: [IntID!]!): [UserTodo!]! @auth

  # Import staging. Creating an import is admin-only (it spends API quota);
  # sources are listed in the background, so the returned sources are LISTING.
  # Anyone signed in: an admin's import starts listing, anyone else's waits as a request.
  createImportJob(input: CreateImportJobInput!): ImportJob! @auth
  # Admin only: approve (start listing) or decline a requested import.
  reviewImportJob(input: ReviewImportJobInput!): ImportJob! @auth
  # Anyone signed in, until the import is closed. Returns how many rows changed.
  setImportItemsExcluded(input: SetImportItemsExcludedInput!): Int! @auth
  # Admin only: close (hide from non-admins, read-only) or reopen an import.
  closeImportJob(input: CloseImportJobInput!): ImportJob! @auth
  # Queues the picked rows and imports them in the background as the caller.
  importItems(input: ImportItemsInput!): ImportItemsResult! @auth
}

type Query {
  # Current authenticated user, derived from the Clerk session
  me: User @auth

  # Get single content by ID
  contentByID(id: ID!): Content

  # Paginated content list with optional filtering
  content(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: ContentSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    # Multi-column sort. When provided (non-empty), takes priority over sortBy/sortOrder,
    # which stay as the single-column fallback for existing clients.
    sorts: [ContentSortInput!]
    includeTotalCount: Boolean = false
    filter: ContentFilter
  ): PaginatedContent!

  # Bible passage text for verse ordinals startVerseId..endVerseId (inclusive, capped server-side)
  passageText(startVerseId: Int!, endVerseId: Int!): PassageText!

  # Original-language word alignment for verse ordinals startVerseId..endVerseId (inclusive, capped server-side).
  # Verses without alignment data are absent from the result.
  passageInterlinear(startVerseId: Int!, endVerseId: Int!): PassageInterlinear!

  # User queries
  userByID(id: ID!): User
  userByUsername(username: String!): User
  users: [User!]!

  # Category queries
  wikidataSearch(query: String!, language: String, limit: Int): [WikidataSearchResult!]!

  # Discover page: YouTube's Trending chart, served from the backend cache so
  # visitors share one API call per page per hour. regionCode defaults to US.
  youtubeTrending(regionCode: String, pageToken: String): YouTubeTrendingPage!

  # Discover page: TMDB movie search (not cached server-side). page defaults to 1 (max 500).
  movieSearch(query: String!, page: Int): MovieSearchPage!

  # Discover page: TMDB trending movies, cached server-side (~1h). window defaults to WEEK; page defaults to 1 (max 500).
  movieTrending(window: TrendingWindow = WEEK, page: Int): MovieSearchPage!

  # Perspective queries
  perspectiveByID(id: ID!): Perspective
  perspectives(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: PerspectiveSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    includeTotalCount: Boolean = false
    filter: PerspectiveFilter
  ): PaginatedPerspectives!

  # How many perspectives carry a given feeling (matched by exact emoji
  # grapheme, e.g. "🥰" for Love; label narrows further, case-insensitively,
  # for the rare case the same emoji is reused for two curated feelings --
  # see FeelingEntry: label is prefilled for curated wheel/search entries),
  # the average and population standard deviation of that feeling's
  # intensity, and what percent of ALL perspectives in scope carry it
  # (percentOfPerspectives = count / totalPerspectives -- "of those with any
  # perspective", not just of those with any feelings at all). Scoped to one
  # content item's perspectives when contentID is given, or platform-wide
  # across every perspective when omitted. Counts public and private
  # perspectives alike, matching PerspectiveAggregate's privacy stance.
  feelingStats(contentID: IntID, emoji: String!, label: String): FeelingStats!

  # How many perspectives set the given CustomFields top-level key (any
  # value), and what percent of ALL perspectives in scope that is. Same
  # scoping/privacy rules as feelingStats.
  customFieldStats(contentID: IntID, key: String!): CustomFieldStats!

  # User todo ("Plan") queries. Privacy-filtered like perspectives: public rows
  # plus the viewer's own, for anonymous and signed-in callers alike.
  userTodos(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: UserTodoSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    includeTotalCount: Boolean = false
    filter: UserTodoFilter
  ): PaginatedUserTodos!

  # Null for a todo that doesn't exist or is someone else's PRIVATE todo.
  userTodoByID(id: ID!): UserTodo

  # Private lists are returned only to their owner.
  userTodoLists(userId: IntID!): [UserTodoList!]!

  # Presets plus the caller's own actions, in picker order.
  todoActions: [TodoAction!]! @auth

  # Import staging (preliminary pages; not linked from the main nav).
  # Closed imports are included only for an admin passing includeClosed.
  importJobs(includeClosed: Boolean = false): [ImportJob!]! @auth
  # Null for an import that doesn't exist.
  importJob(id: ID!): ImportJob @auth
  # Null for a row that doesn't exist.
  importItemDetails(id: ID!): ImportItemDetails @auth
}

# See Query.feelingStats. averageIntensity/stdDevIntensity are null when
# count is 0 (nothing to average); stdDevIntensity is also null when count
# is 1 (standard deviation of a single value is undefined here, not 0).
# percentOfPerspectives is null only when totalPerspectives is 0 (no
# perspectives at all in scope to take a percentage of).
type FeelingStats {
  emoji: String!
  label: String
  count: Int!
  totalPerspectives: Int!
  averageIntensity: Float
  stdDevIntensity: Float
  percentOfPerspectives: Float
}

# See Query.customFieldStats. percentOfPerspectives is null only when
# totalPerspectives is 0.
type CustomFieldStats {
  key: String!
  count: Int!
  totalPerspectives: Int!
  percentOfPerspectives: Float
}

# User todos ("Plan"). Spec: docs/superpowers/specs/2026-10-08-user-todos-design.md.
enum UserTodoStatus {
  NOT_STARTED
  IN_PROGRESS
  DONE
  DROPPED
}

enum UserTodoSortBy {
  PRIORITY
  DUE_DATE
  CREATED_AT
  UPDATED_AT
  LIST_POSITION
}

# A todo's action (consume, research, share, ...). isPreset is false for an
# action the viewer entered themselves.
type TodoAction {
  id: ID!
  key: String!
  label: String!
  description: String!
  "Picker order for presets; null for actions the user entered."
  typicalSequence: Int
  isPreset: Boolean!
}

type UserTodoList {
  id: ID!
  user: User!
  name: String!
  description: String
  privacy: Privacy!
  createdAt: String!
  updatedAt: String!
}

type UserTodo {
  id: ID!
  user: User!
  content: Content
  "Free-text name; only meaningful when content is null."
  name: String
  action: TodoAction!
  priority: Int
  status: UserTodoStatus!
  percentComplete: Int!
  "ISO date, YYYY-MM-DD."
  startDate: String
  "ISO date, YYYY-MM-DD. When the todo was finished."
  endDate: String
  "ISO date, YYYY-MM-DD. The target date."
  dueDate: String
  "Sanitized HTML."
  comments: String
  privacy: Privacy!
  list: UserTodoList
  listPosition: Int
  createdAt: String!
  updatedAt: String!
}

type PaginatedUserTodos {
  items: [UserTodo!]!
  pageInfo: PageInfo!
  totalCount: Int
}

input UserTodoFilter {
  userId: IntID
  contentId: IntID
  listId: IntID
  "Only todos in no list. Ignored when listId is set."
  unlisted: Boolean
  status: [UserTodoStatus!]
  actionId: IntID
}

input CreateUserTodoInput {
  contentId: IntID
  name: String
  actionId: IntID!
  priority: Int
  status: UserTodoStatus
  percentComplete: Int
  "ISO date, YYYY-MM-DD."
  startDate: String
  "ISO date, YYYY-MM-DD."
  endDate: String
  "ISO date, YYYY-MM-DD."
  dueDate: String
  comments: String
  privacy: Privacy
  listId: IntID
}

"""
Partial update: omit a field to leave it unchanged. For contentId, name,
priority, startDate, endDate, dueDate, comments and listId, an explicit null
clears the field. The other fields are not clearable: null is the same as omitted.
"""
input UpdateUserTodoInput {
  id: IntID!
  "Omit = unchanged; null = clear."
  contentId: IntID
  "Omit = unchanged; null = clear."
  name: String
  actionId: IntID
  "Omit = unchanged; null = clear."
  priority: Int
  status: UserTodoStatus
  percentComplete: Int
  "Omit = unchanged; null = clear. ISO date, YYYY-MM-DD."
  startDate: String
  "Omit = unchanged; null = clear. ISO date, YYYY-MM-DD."
  endDate: String
  "Omit = unchanged; null = clear. ISO date, YYYY-MM-DD."
  dueDate: String
  "Omit = unchanged; null = clear."
  comments: String
  privacy: Privacy
  "Omit = unchanged; null = unlist."
  listId: IntID
}

input CreateTodoActionInput {
  label: String!
  description: String
}

input CreateUserTodoListInput {
  name: String!
  description: String
  privacy: Privacy
}

"""
Partial update: omit a field to leave it unchanged. An explicit null clears
description. Name and privacy are not clearable.
"""
input UpdateUserTodoListInput {
  id: IntID!
  name: String
  "Omit = unchanged; null = clear."
  description: String
  privacy: Privacy
}
