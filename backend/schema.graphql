# Time window for TMDB trending lists.
enum TrendingWindow {
  DAY
  WEEK
}

type WikidataSearchResult {
  qid: String!
  label: String!
  description: String
  entityType: String
}

"Smallest unit a source reports a length in."
enum LengthPrecision {
  "Format as h:mm:ss, or m:ss under an hour."
  SECONDS
  "Format as h:mm (e.g. a TMDB movie runtime)."
  MINUTES
}

"""
Where a content length came from and the smallest unit that source reports.
`length` is always seconds; show it to `precision`.
"""
type LengthDisplay {
  "Origin of the length, e.g. youtube, tmdb."
  source: String!
  precision: LengthPrecision!
}

type Content {
  id: ID!
  name: String!
  url: String
  contentType: String!
  addedByUserID: ID!
  addedBy: User
  length: Int
  lengthUnits: String
  "Where length came from and the smallest unit it reports; format length to that precision."
  lengthDisplay: LengthDisplay
  viewCount: Int
  likeCount: Int
  commentCount: Int
  channelTitle: String
  publishedAt: String
  tags: [String!]
  description: String
  response: JSON
  "Movie-specific metadata (the shaped TMDB payload); null for other content types."
  movie: JSON
  primaryCategory: Category
  # BIBLE_PASSAGE only: computed verse ordinals (see bible_book.verses_per_chapter)
  # and the optional, first-write-wins display title. Null for other content types.
  verseStartID: Int
  verseEndID: Int
  displayTitle: String
  # Aggregates computed from ALL perspectives on this content — public and
  # private alike (privacy controls readability, not whether a perspective
  # counts here). Resolved on demand (batched per-request via dataloader)
  # rather than stored on the content row — a client only pays for these
  # when it actually selects them, e.g. the details modal, not the main
  # content list.
  perspectiveCount: Int
  # Like perspectiveCount, but only perspectives the caller may read: public
  # ones plus their own private ones. This is the number the Compare page can
  # actually show; perspectiveCount can be higher because it includes other
  # people's private perspectives. Always an Int (0 when none visible).
  visiblePerspectiveCount: Int
  averageRating: Float
  # How many of this content's perspectives set a Quality rating — i.e.
  # how many values averageRating was actually computed over. Can be
  # less than perspectiveCount since Quality is optional. Meant for a tooltip
  # on the average rating display ("N quality ratings").
  qualityRatingCount: Int
  createdAt: String!
  updatedAt: String!
}

# Pagination types
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PaginatedContent {
  items: [Content!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# Sorting enums
enum ContentSortBy {
  CREATED_AT
  UPDATED_AT
  NAME
  VIEW_COUNT
  LIKE_COUNT
  PERCENT_LIKED
  PUBLISHED_AT
  CHANNEL_TITLE
  LENGTH
  BOX_OFFICE
  VS_BUDGET
  AGE_RATING
  RELEASE_DATE
  TMDB_SCORE
  # Username of the user who added the content (case-insensitive)
  ADDED_BY
}

enum SortOrder {
  ASC
  DESC
}

# One column of a multi-column sort, in priority order (first entry breaks ties first).
input ContentSortInput {
  field: ContentSortBy!
  order: SortOrder!
}

enum ContentType {
  YOUTUBE_VIDEO
  CLAIM
  BIBLE_PASSAGE
  MOVIE
}

# Text columns that ContentFilter.search can be scoped to.
enum ContentSearchField {
  TITLE
  DESCRIPTION
  CHANNEL_TITLE
  TAGS
  CAST
  DIRECTOR
}

# Role a person plays on a movie (ContentFilter.personRole).
enum PersonRole {
  CAST
  DIRECTOR
}

# Inputs
input CreateContentFromMovieInput {
  # IMDb or TMDB movie URL
  url: String!
}

input CreateContentFromYouTubeInput {
  url: String!
  userId: IntID!
}

# Find-or-create a Bible passage. endChapter/endVerse equal startChapter/startVerse
# for a single verse. userID is accepted only if it matches the session (or 0).
input CreateContentFromPassageInput {
  bookID: Int!
  startChapter: Int!
  startVerse: Int!
  endChapter: Int!
  endVerse: Int!
  userID: IntID!
}

input SetPassageDisplayTitleInput {
  contentID: IntID!
  title: String!
}

# BSB (public domain) text for a verse-ordinal range.
type PassageVerse {
  verseId: Int!
  chapter: Int!
  verse: Int!
  # Empty for verses the BSB omits (e.g. Matthew 17:21).
  text: String!
}

type PassageText {
  translation: String!
  copyright: String!
  verses: [PassageVerse!]!
}

# One run of a verse's English text; concatenating segments (a space before each with
# spaceBefore) reproduces the plain BSB verse.
type InterlinearSegment {
  text: String!
  spaceBefore: Boolean!
}

# One Hebrew/Greek source word. Words are in original-language order; id is the index in that order.
type InterlinearWord {
  id: Int!
  language: String!
  source: String!
  translit: String!
  parsing: String!
  # Disambiguated STEPBible tag (e.g. H1254B); Berean's own plain number is kept server-side.
  strongs: String!
  # Short meaning (STEPBible Gloss, CC BY 4.0).
  gloss: String!
  # "tagged" (exact match) or "fallback" (most common sense for the plain number).
  tagSource: String!
  sourceOrder: Int!
  # Index into the verse's segments of the English phrase this word belongs to; null = no phrase.
  segment: Int
}

type InterlinearVerse {
  verseId: Int!
  chapter: Int!
  verse: Int!
  segments: [InterlinearSegment!]!
  words: [InterlinearWord!]!
}

type PassageInterlinear {
  verses: [InterlinearVerse!]!
}

# Filters for content queries
input ContentFilter {
  contentType: ContentType
  # Match any of these types (OR'd). Omitted/empty = no type filter. ANDed with contentType if both are set.
  contentTypes: [ContentType!]
  minLengthSeconds: Int
  maxLengthSeconds: Int
  search: String
  # Which columns `search` matches against (OR'd together). Omitted/empty = TITLE only.
  searchFields: [ContentSearchField!]
  # Match movies by person; personRole narrows to CAST or DIRECTOR (omitted = either).
  personId: IntID
  personRole: PersonRole
  # Movie column filters (movie rows only; other rows have no such data and never match)
  genreContains: String      # Case-insensitive contains on the genre names
  castContains: String       # Case-insensitive contains on a cast or director name
  ageRating: [String!]       # Certification is any of these (e.g. PG-13, R)
  releasedAfter: String      # ISO date (YYYY-MM-DD), inclusive
  releasedBefore: String     # ISO date (YYYY-MM-DD), inclusive
  minBoxOffice: Float        # Revenue in dollars, inclusive
  maxBoxOffice: Float
  minTmdbScore: Float        # TMDB vote average (0-10), inclusive
  maxTmdbScore: Float
  # View/like count filters
  minViewCount: Int
  maxViewCount: Int
  minLikeCount: Int
  maxLikeCount: Int
  # Published date filters (ISO 8601 date string)
  publishedAfter: String
  publishedBefore: String
  # Channel/tag/description filters
  channelTitle: String       # ILIKE search
  tagContains: String        # Tag text contains
  descriptionSearch: String  # ILIKE search on description
  # ILIKE search on the username of the user who added the content
  addedByUsername: String
  # Only content with at least this many perspectives visible to the caller
  # (public ones, plus their own private ones). Applied before pagination.
  minPerspectiveCount: Int
  # Record date filters
  createdAfter: String
  createdBefore: String
  updatedAfter: String
  updatedBefore: String
}

