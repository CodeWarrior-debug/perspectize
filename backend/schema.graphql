scalar JSON
scalar IntID

directive @auth on FIELD_DEFINITION
directive @owner(idField: String!) on FIELD_DEFINITION

# User enums
enum UserRole {
  ADMIN
  SENTINEL
  DEFAULT
}

# Thin first-run checklist coach state (see docs/onboarding-checklist-coach.md)
type UserOnboarding {
  version: Int!
  displayNextSession: Boolean!
  completedAt: String
}

# User type
type User {
  id: ID!
  username: String!
  email: String
  active: Boolean!
  role: UserRole!
  onboarding: UserOnboarding!
  createdAt: String!
  updatedAt: String!
}

# Perspective enums
enum Privacy {
  PUBLIC
  PRIVATE
}

enum ReviewStatus {
  PENDING
  APPROVED
  REJECTED
}

enum PerspectiveSortBy {
  CREATED_AT
  UPDATED_AT
}

# Perspective type
type CategorizedRating {
  category: String!
  rating: Int!
}

# One emoji feeling selection from the feel-wheel (or its extended search set)
type FeelingEntry {
  emoji: String!
  label: String
  intensity: Int!
  note: String
}

type Perspective {
  id: ID!
  userID: ID!
  user: User
  contentID: ID
  content: Content
  quality: Int
  agreement: Int
  importance: Int
  confidence: Int
  like: String
  privacy: Privacy!
  description: String
  category: String
  reviewStatus: ReviewStatus
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRating!]
  feelings: [FeelingEntry!]
  primaryPerspectiveID: ID
  relatedPerspectiveIDs: [Int!]
  customFields: JSON
  review: String
  createdAt: String!
  updatedAt: String!
}

type PaginatedPerspectives {
  items: [Perspective!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type CreateContentResult {
  content: Content!
  alreadyExisted: Boolean!
}

type Category {
  id: ID!
  wikidataQid: String!
  label: String!
  description: String
  entityType: String
  createdAt: String!
  updatedAt: String!
}

type WikidataSearchResult {
  qid: String!
  label: String!
  description: String
  entityType: String
}

type Content {
  id: ID!
  name: String!
  url: String
  contentType: String!
  addedByUserID: ID!
  addedBy: User
  length: Int
  lengthUnits: String
  viewCount: Int
  likeCount: Int
  commentCount: Int
  channelTitle: String
  publishedAt: String
  tags: [String!]
  description: String
  response: JSON
  primaryCategory: Category
  createdAt: String!
  updatedAt: String!
}

# Pagination types
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PaginatedContent {
  items: [Content!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# Sorting enums
enum ContentSortBy {
  CREATED_AT
  UPDATED_AT
  NAME
  VIEW_COUNT
  LIKE_COUNT
  PUBLISHED_AT
  CHANNEL_TITLE
  LENGTH
}

enum SortOrder {
  ASC
  DESC
}

enum ContentType {
  YOUTUBE
  CLAIM
}

# Inputs
input CreateContentFromYouTubeInput {
  url: String!
  userId: IntID!
}

# Filters for content queries
input ContentFilter {
  contentType: ContentType
  minLengthSeconds: Int
  maxLengthSeconds: Int
  search: String
  # View/like count filters
  minViewCount: Int
  maxViewCount: Int
  minLikeCount: Int
  maxLikeCount: Int
  # Published date filters (ISO 8601 date string)
  publishedAfter: String
  publishedBefore: String
  # Channel/tag/description filters
  channelTitle: String       # ILIKE search
  tagContains: String        # Tag text contains
  descriptionSearch: String  # ILIKE search on description
  # Record date filters
  createdAfter: String
  createdBefore: String
  updatedAfter: String
  updatedBefore: String
}

# User inputs
input CreateUserInput {
  username: String!
  email: String
}

input UpdateUserInput {
  id: IntID!
  username: String
  email: String
}

# Perspective inputs
input CategorizedRatingInput {
  category: String!
  rating: Int!
}

input FeelingInput {
  emoji: String!
  label: String
  intensity: Int!
  note: String
}

input CreatePerspectiveInput {
  userID: IntID!
  contentID: IntID
  quality: Int
  agreement: Int
  importance: Int
  confidence: Int
  like: String
  privacy: Privacy
  description: String
  category: String
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRatingInput!]
  feelings: [FeelingInput!]
  primaryPerspectiveID: IntID
  relatedPerspectiveIDs: [Int!]
  customFields: JSON
  review: String
}

input UpdatePerspectiveInput {
  id: IntID!
  contentID: IntID
  quality: Int
  agreement: Int
  importance: Int
  confidence: Int
  like: String
  privacy: Privacy
  description: String
  category: String
  reviewStatus: ReviewStatus
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRatingInput!]
  feelings: [FeelingInput!]
  primaryPerspectiveID: IntID
  relatedPerspectiveIDs: [Int!]
  customFields: JSON
  review: String
}

input PerspectiveFilter {
  userID: IntID
  contentID: IntID
  privacy: Privacy
}

input SetPrimaryCategoryInput {
  contentId: IntID!
  qid: String!
  label: String!
  description: String
  entityType: String
}

input CreateClaimInput {
  text: String!            # The claim text (may contain @this/@here tokens)
  userID: IntID!           # Who created the claim
  parentContentID: IntID!  # The content item this claim is about
}

type Mutation {
  createContentFromYouTube(input: CreateContentFromYouTubeInput!): CreateContentResult! @auth
  updateContentSourceData(contentId: IntID!): Content! @auth

  # User mutations
  createUser(input: CreateUserInput!): User! @auth
  updateUser(input: UpdateUserInput!): User! @auth
  deleteUser(id: ID!): Boolean! @auth

  # Onboarding (authenticated owner only — no client userId)
  markOnboardingSeen(version: Int!): UserOnboarding! @auth
  setOnboardingDisplayNextSession(displayNextSession: Boolean!): UserOnboarding! @auth

  # Perspective mutations
  createPerspective(input: CreatePerspectiveInput!): Perspective! @auth
  updatePerspective(input: UpdatePerspectiveInput!): Perspective! @auth @owner(idField: "id")
  deletePerspective(id: ID!): Boolean! @auth @owner(idField: "id")

  # Claim mutations
  createClaim(input: CreateClaimInput!): Content! @auth

  # Category mutations
  setPrimaryCategory(input: SetPrimaryCategoryInput!): Content! @auth
}

type Query {
  # Current authenticated user, derived from the Clerk session
  me: User @auth

  # Get single content by ID
  contentByID(id: ID!): Content

  # Paginated content list with optional filtering
  content(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: ContentSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    includeTotalCount: Boolean = false
    filter: ContentFilter
  ): PaginatedContent!

  # User queries
  userByID(id: ID!): User
  userByUsername(username: String!): User
  users: [User!]!

  # Category queries
  wikidataSearch(query: String!, language: String, limit: Int): [WikidataSearchResult!]!

  # Perspective queries
  perspectiveByID(id: ID!): Perspective
  perspectives(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: PerspectiveSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    includeTotalCount: Boolean = false
    filter: PerspectiveFilter
  ): PaginatedPerspectives!
}
