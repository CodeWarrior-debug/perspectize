scalar JSON
scalar IntID

directive @auth on FIELD_DEFINITION
directive @owner(idField: String!) on FIELD_DEFINITION

# User enums
enum UserRole {
  ADMIN
  SENTINEL
  DEFAULT
}

# Thin first-run checklist coach state (see docs/onboarding-checklist-coach.md)
type UserOnboarding {
  version: Int!
  displayNextSession: Boolean!
  completedAt: String
}

# User type
type User {
  id: ID!
  username: String!
  email: String
  active: Boolean!
  role: UserRole!
  onboarding: UserOnboarding!
  createdAt: String!
  updatedAt: String!
}

# Perspective enums
enum Privacy {
  PUBLIC
  PRIVATE
}

enum ReviewStatus {
  PENDING
  APPROVED
  REJECTED
}

enum PerspectiveSortBy {
  CREATED_AT
  UPDATED_AT
}

# Perspective type
type CategorizedRating {
  category: String!
  rating: Int!
}

# One emoji feeling selection from the feel-wheel (or its extended search set)
type FeelingEntry {
  emoji: String!
  label: String
  intensity: Int!
  note: String
}

type Perspective {
  id: ID!
  userID: ID!
  user: User
  contentID: ID
  content: Content
  quality: Int
  agreement: Int
  importance: Int
  confidence: Int
  like: String
  privacy: Privacy!
  description: String
  category: String
  reviewStatus: ReviewStatus
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRating!]
  feelings: [FeelingEntry!]
  primaryPerspectiveID: ID
  relatedPerspectiveIDs: [Int!]
  customFields: JSON
  review: String
  createdAt: String!
  updatedAt: String!
}

type PaginatedPerspectives {
  items: [Perspective!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type CreateContentResult {
  content: Content!
  alreadyExisted: Boolean!
}

type Category {
  id: ID!
  wikidataQid: String!
  label: String!
  description: String
  entityType: String
  wikipediaUrl: String
  createdAt: String!
  updatedAt: String!
}

type WikidataSearchResult {
  qid: String!
  label: String!
  description: String
  entityType: String
}

type Content {
  id: ID!
  name: String!
  url: String
  contentType: String!
  addedByUserID: ID!
  addedBy: User
  length: Int
  lengthUnits: String
  viewCount: Int
  likeCount: Int
  commentCount: Int
  channelTitle: String
  publishedAt: String
  tags: [String!]
  description: String
  response: JSON
  primaryCategory: Category
  # BIBLE_PASSAGE only: computed verse ordinals (see bible_book.verses_per_chapter)
  # and the optional, first-write-wins display title. Null for other content types.
  verseStartID: Int
  verseEndID: Int
  displayTitle: String
  # Aggregates computed from ALL perspectives on this content — public and
  # private alike (privacy controls readability, not whether a perspective
  # counts here). Resolved on demand (batched per-request via dataloader)
  # rather than stored on the content row — a client only pays for these
  # when it actually selects them, e.g. the details modal, not the main
  # content list.
  perspectiveCount: Int
  averageRating: Float
  # How many of this content's perspectives set a Quality rating — i.e.
  # how many values averageRating was actually computed over. Can be
  # less than perspectiveCount since Quality is optional. Meant for a tooltip
  # on the average rating display ("N quality ratings").
  qualityRatingCount: Int
  createdAt: String!
  updatedAt: String!
}

# Pagination types
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PaginatedContent {
  items: [Content!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# Sorting enums
enum ContentSortBy {
  CREATED_AT
  UPDATED_AT
  NAME
  VIEW_COUNT
  LIKE_COUNT
  PERCENT_LIKED
  PUBLISHED_AT
  CHANNEL_TITLE
  LENGTH
}

enum SortOrder {
  ASC
  DESC
}

# One column of a multi-column sort, in priority order (first entry breaks ties first).
input ContentSortInput {
  field: ContentSortBy!
  order: SortOrder!
}

enum ContentType {
  YOUTUBE
  CLAIM
  BIBLE_PASSAGE
}

# Text columns that ContentFilter.search can be scoped to.
enum ContentSearchField {
  TITLE
  DESCRIPTION
  CHANNEL_TITLE
  TAGS
}

# Inputs
input CreateContentFromYouTubeInput {
  url: String!
  userId: IntID!
}

# Find-or-create a Bible passage. endChapter/endVerse equal startChapter/startVerse
# for a single verse. userID is accepted only if it matches the session (or 0).
input CreateContentFromPassageInput {
  bookID: Int!
  startChapter: Int!
  startVerse: Int!
  endChapter: Int!
  endVerse: Int!
  userID: IntID!
}

input SetPassageDisplayTitleInput {
  contentID: IntID!
  title: String!
}

# BSB (public domain) text for a verse-ordinal range.
type PassageVerse {
  verseId: Int!
  chapter: Int!
  verse: Int!
  # Empty for verses the BSB omits (e.g. Matthew 17:21).
  text: String!
}

type PassageText {
  translation: String!
  copyright: String!
  verses: [PassageVerse!]!
}

# One run of a verse's English text; concatenating segments (a space before each with
# spaceBefore) reproduces the plain BSB verse.
type InterlinearSegment {
  text: String!
  spaceBefore: Boolean!
}

# One Hebrew/Greek source word. Words are in original-language order; id is the index in that order.
type InterlinearWord {
  id: Int!
  language: String!
  source: String!
  translit: String!
  parsing: String!
  # Disambiguated STEPBible tag (e.g. H1254B); Berean's own plain number is kept server-side.
  strongs: String!
  # Short meaning (STEPBible Gloss, CC BY 4.0).
  gloss: String!
  # "tagged" (exact match) or "fallback" (most common sense for the plain number).
  tagSource: String!
  sourceOrder: Int!
  # Index into the verse's segments of the English phrase this word belongs to; null = no phrase.
  segment: Int
}

type InterlinearVerse {
  verseId: Int!
  chapter: Int!
  verse: Int!
  segments: [InterlinearSegment!]!
  words: [InterlinearWord!]!
}

type PassageInterlinear {
  verses: [InterlinearVerse!]!
}

# Filters for content queries
input ContentFilter {
  contentType: ContentType
  minLengthSeconds: Int
  maxLengthSeconds: Int
  search: String
  # Which columns `search` matches against (OR'd together). Omitted/empty = TITLE only.
  searchFields: [ContentSearchField!]
  # View/like count filters
  minViewCount: Int
  maxViewCount: Int
  minLikeCount: Int
  maxLikeCount: Int
  # Published date filters (ISO 8601 date string)
  publishedAfter: String
  publishedBefore: String
  # Channel/tag/description filters
  channelTitle: String       # ILIKE search
  tagContains: String        # Tag text contains
  descriptionSearch: String  # ILIKE search on description
  # Record date filters
  createdAfter: String
  createdBefore: String
  updatedAfter: String
  updatedBefore: String
}

# User inputs
input CreateUserInput {
  username: String!
  email: String
}

input UpdateUserInput {
  id: IntID!
  username: String
  email: String
}

# Perspective inputs
input CategorizedRatingInput {
  category: String!
  rating: Int!
}

input FeelingInput {
  emoji: String!
  label: String
  intensity: Int!
  note: String
}

input CreatePerspectiveInput {
  userID: IntID!
  contentID: IntID
  quality: Int
  agreement: Int
  importance: Int
  confidence: Int
  like: String
  privacy: Privacy
  description: String
  category: String
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRatingInput!]
  feelings: [FeelingInput!]
  primaryPerspectiveID: IntID
  relatedPerspectiveIDs: [Int!]
  customFields: JSON
  review: String
}

"""
Partial update: omit a field to leave it unchanged. For quality, agreement,
importance, confidence, like, review, customFields and feelings, sending an
explicit null clears the field (an empty feelings list or empty customFields
object also clears). Every other field is a plain optional -- omit to leave
unchanged, no way to clear it yet.
"""
input UpdatePerspectiveInput {
  id: IntID!
  contentID: IntID
  "Omit = unchanged; null = clear."
  quality: Int
  "Omit = unchanged; null = clear."
  agreement: Int
  "Omit = unchanged; null = clear."
  importance: Int
  "Omit = unchanged; null = clear."
  confidence: Int
  "Omit = unchanged; null = clear."
  like: String
  privacy: Privacy
  description: String
  category: String
  reviewStatus: ReviewStatus
  parts: [Int!]
  labels: [String!]
  categorizedRatings: [CategorizedRatingInput!]
  "Omit = unchanged; null or [] = clear."
  feelings: [FeelingInput!]
  primaryPerspectiveID: IntID
  relatedPerspectiveIDs: [Int!]
  "Omit = unchanged; null or {} = clear."
  customFields: JSON
  "Omit = unchanged; null = clear."
  review: String
}

input PerspectiveFilter {
  userID: IntID
  contentID: IntID
  privacy: Privacy
}

input SetPrimaryCategoryInput {
  contentId: IntID!
  qid: String!
  label: String!
  description: String
  entityType: String
}

input CreateClaimInput {
  text: String!            # The claim text (may contain @this/@here tokens)
  userID: IntID!           # Who created the claim
  parentContentID: IntID!  # The content item this claim is about
}

type Mutation {
  createContentFromYouTube(input: CreateContentFromYouTubeInput!): CreateContentResult! @auth
  updateContentSourceData(contentId: IntID!): Content! @auth

  # Bible passage mutations
  createContentFromPassage(input: CreateContentFromPassageInput!): Content! @auth
  # First-write-wins: if a title already exists, returns the content with the existing title.
  setPassageDisplayTitle(input: SetPassageDisplayTitleInput!): Content! @auth
  # Admin only: resets the title so it can be set again.
  clearPassageDisplayTitle(contentId: IntID!): Content! @auth

  # User mutations
  createUser(input: CreateUserInput!): User! @auth
  updateUser(input: UpdateUserInput!): User! @auth
  deleteUser(id: ID!): Boolean! @auth

  # Onboarding (authenticated owner only — no client userId)
  markOnboardingSeen(version: Int!): UserOnboarding! @auth
  setOnboardingDisplayNextSession(displayNextSession: Boolean!): UserOnboarding! @auth

  # Perspective mutations
  createPerspective(input: CreatePerspectiveInput!): Perspective! @auth
  updatePerspective(input: UpdatePerspectiveInput!): Perspective! @auth @owner(idField: "id")
  deletePerspective(id: ID!): Boolean! @auth @owner(idField: "id")

  # Claim mutations
  createClaim(input: CreateClaimInput!): Content! @auth

  # Category mutations
  setPrimaryCategory(input: SetPrimaryCategoryInput!): Content! @auth
}

type Query {
  # Current authenticated user, derived from the Clerk session
  me: User @auth

  # Get single content by ID
  contentByID(id: ID!): Content

  # Paginated content list with optional filtering
  content(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: ContentSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    # Multi-column sort. When provided (non-empty), takes priority over sortBy/sortOrder,
    # which stay as the single-column fallback for existing clients.
    sorts: [ContentSortInput!]
    includeTotalCount: Boolean = false
    filter: ContentFilter
  ): PaginatedContent!

  # Bible passage text for verse ordinals startVerseId..endVerseId (inclusive, capped server-side)
  passageText(startVerseId: Int!, endVerseId: Int!): PassageText!

  # Original-language word alignment for verse ordinals startVerseId..endVerseId (inclusive, capped server-side).
  # Verses without alignment data are absent from the result.
  passageInterlinear(startVerseId: Int!, endVerseId: Int!): PassageInterlinear!

  # User queries
  userByID(id: ID!): User
  userByUsername(username: String!): User
  users: [User!]!

  # Category queries
  wikidataSearch(query: String!, language: String, limit: Int): [WikidataSearchResult!]!

  # Perspective queries
  perspectiveByID(id: ID!): Perspective
  perspectives(
    first: Int = 10
    after: String
    last: Int
    before: String
    sortBy: PerspectiveSortBy = CREATED_AT
    sortOrder: SortOrder = DESC
    includeTotalCount: Boolean = false
    filter: PerspectiveFilter
  ): PaginatedPerspectives!
}
