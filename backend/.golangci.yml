version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - gocritic
    - revive
    - misspell
    - prealloc
    - unconvert
    - nilerr
    - depguard

  settings:
    depguard:
      rules:
        core-purity:
          files:
            - "**/internal/core/**"
            - "!**/internal/core/**/*_test.go"
          deny:
            - pkg: "gorm.io/gorm"
              desc: "internal/core must stay persistence-agnostic; put GORM usage in internal/adapters"
            - pkg: "github.com/99designs/gqlgen"
              desc: "internal/core must stay transport-agnostic; put gqlgen usage in internal/adapters"
            - pkg: "github.com/CodeWarrior-debug/perspectize/backend/internal/adapters"
              desc: "internal/core must not depend on internal/adapters (hexagonal boundary)"

    gocritic:
      enabled-checks:
        - nilValReturn
        - truncateCmp
        - unnecessaryBlock

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: receiver-naming
        - name: unexported-return
        - name: var-naming

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
        text: "dot-imports"
      - path: _test\.go
        linters:
          - gocritic
    paths:
      - vendor
      - bin
      - tmp
