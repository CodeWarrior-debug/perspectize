# gqlgen configuration
# See https://gqlgen.com/config/ for details

schema:
  - schema.graphql
  - messaging.graphql

exec:
  filename: internal/adapters/graphql/generated/generated.go
  package: generated

model:
  filename: internal/adapters/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/adapters/graphql/resolvers
  package: resolvers
  filename_template: "{name}.resolvers.go"

# Map GraphQL types to Go types
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Map

  # Custom scalar for ID conversion
  IntID:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/pkg/graphql.IntID

  # Sort enums - bind directly to domain types
  SortOrder:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.SortOrder
  ContentSortBy:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.ContentSortBy
  PerspectiveSortBy:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.PerspectiveSortBy

  # Stored enums - bind directly to domain types
  Privacy:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.Privacy
  ContentType:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.ContentType
  ContentSearchField:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.ContentSearchField
  ReviewStatus:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.ReviewStatus
  UserRole:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.UserRole

  # Messaging enums - bind directly to domain types
  ThreadRole:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.ThreadRole
  PresenceState:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/core/domain.PresenceState

  # Messaging types with hand-written models (see model/messaging.go) so field
  # resolvers can reach the underlying domain aggregate.
  MessageThread:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/adapters/graphql/model.MessageThread
  ThreadParticipant:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/adapters/graphql/model.ThreadParticipant
  Message:
    model:
      - github.com/CodeWarrior-debug/perspectize/backend/internal/adapters/graphql/model.Message
    fields:
      # model.Message carries editedAt/deletedAt as preformatted string pointers,
      # but keep them as field resolvers so the generated code is unchanged from
      # the A3 baseline (the resolvers just surface obj.EditedAt / obj.DeletedAt).
      editedAt:
        resolver: true
      deletedAt:
        resolver: true
  User:
    fields:
      email:
        resolver: true
  Content:
    fields:
      primaryCategory:
        resolver: true
      perspectiveCount:
        resolver: true
      averageRating:
        resolver: true
      qualityRatingCount:
        resolver: true
    # Non-schema field: carries the primary_category_id FK already loaded by
    # the content list query so the primaryCategory resolver can batch-load the
    # category via dataloader instead of re-fetching the content row per item.
    extraFields:
      PrimaryCategoryID:
        type: "*int"
  # Tri-state update fields: an omitted key leaves the value unchanged; an
  # explicit `null` clears it. Generated as graphql.Omittable[T]; the mapper
  # (modelToUpdatePerspectiveInput in helpers.go) reads IsSet()/Value() to
  # translate that into the ClearX flags perspective_service.go's Update()
  # acts on. See the UI gap audit, gap #2, for why plain nullable pointers
  # couldn't express "clear this field" (omitted and null both decoded to nil).
  UpdatePerspectiveInput:
    fields:
      quality:
        omittable: true
      agreement:
        omittable: true
      importance:
        omittable: true
      confidence:
        omittable: true
      like:
        omittable: true
      review:
        omittable: true
      customFields:
        omittable: true
      feelings:
        omittable: true
