allowBuilds:
  esbuild: true
  '@clerk/shared': true

onlyBuiltDependencies:
  - esbuild
  - '@clerk/shared'

# Single source of truth for dependency overrides.
#
# These MUST NOT be duplicated in package.json's `pnpm.overrides` block: pnpm
# 10.33 (local + `pnpm/action-setup` in CI) resolves `pnpm.overrides` from
# package.json and ignores this file's `overrides:`, while Dependabot's pnpm
# helper does the reverse. With both populated and drifted apart, every
# Dependabot PR regenerated the lockfile against *this* file's values and then
# failed `pnpm install --frozen-lockfile` in CI with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Keep overrides here only.
overrides:
  postcss: '>=8.5.18'
  nanoid: '>=3.3.18 <5 || >=5.1.6 <6'
  js-cookie: ^3.0.8
  cookie: ^0.7.2
  serialize-javascript: ^7.1.0
  brace-expansion: ^5.0.9
  picomatch: ^4.0.4
  'vitest>picomatch': ^4.0.5
  '@xmldom/xmldom': ^0.9.12
  ws: ^8.21.3
  esbuild: ^0.28.2
  tar: ^7.5.22
  prosemirror-transform: 1.12.0
  fast-uri: ^3.1.6
  undici: ^7.24.0
  devalue: ^5.8.1
  '@lucide/svelte': 1.43.0
# Dropped when the two override sources were reconciled: `rollup: ^4.59.0`,
# `minimatch: ^10.2.3` and `tinyglobby>picomatch: ^4.0.4`. The first two were
# never in effect (package.json won, and the tree still resolves rollup@2.80.0
# and minimatch@5.1.9 as pinned peers of workbox-build's @rollup/* plugins, so
# activating them now would be an unrelated breaking change); the third is
# subsumed by the global `picomatch` override above.
