<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.services https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://yt3.ggpht.com https://img.clerk.com; connect-src 'self' http://localhost:8080 https://*.sevalla.app https://api.perspectize.com https://*.clerk.accounts.dev https://*.clerk.services https://www.googleapis.com; font-src 'self' data:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com https://*.clerk.accounts.dev; base-uri 'self'; form-action 'self';"
		/>
		<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the persisted theme before paint to avoid a flash of the default theme.
			// Reads a cache written by lib/theme/store.svelte.ts — no derivation logic here.
			(function () {
				try {
					var raw = localStorage.getItem('perspectize-theme-applied');
					if (!raw) return;
					var cache = JSON.parse(raw);
					var root = document.documentElement;
					if (cache.dataThemeId) {
						root.setAttribute('data-theme', cache.dataThemeId);
					} else if (cache.vars) {
						for (var k in cache.vars) {
							root.style.setProperty(k, cache.vars[k]);
						}
					}
				} catch (e) {
					// Corrupt/unavailable cache — fall back to the default theme silently.
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
