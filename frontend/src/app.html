<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.services https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 ws://localhost:8080 https://*.sevalla.app wss://*.sevalla.app https://api.perspectize.com wss://api.perspectize.com https://*.clerk.accounts.dev https://*.clerk.services https://www.googleapis.com; font-src 'self' data:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com https://*.clerk.accounts.dev; base-uri 'self'; form-action 'self';"
		/>
		<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			/* Static pre-hydration loading state: paints before any JS runs, so the
			   LCP element isn't stuck waiting on the full CSR bundle (incl. Clerk)
			   to load and execute. Hidden the instant #app-root gets real content. */
			.ssr-loading {
				display: flex;
				height: 100vh;
				align-items: center;
				justify-content: center;
				color: var(--color-muted-foreground, #525252);
				font-family: Geist, system-ui, sans-serif;
			}
			/* SvelteKit's hydration bootstrap injects a <script> directly inside
			   #app-root, so :empty never matches — key off any *rendered* child. */
			#app-root:has(> :not(script)) ~ .ssr-loading {
				display: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply the persisted theme before paint to avoid a flash of the default theme.
			// Reads a cache written by lib/theme/store.svelte.ts — no derivation logic here.
			(function () {
				try {
					var raw = localStorage.getItem('perspectize-theme-applied');
					if (!raw) return;
					var cache = JSON.parse(raw);
					var root = document.documentElement;
					if (cache.dataThemeId) {
						root.setAttribute('data-theme', cache.dataThemeId);
					} else if (cache.vars) {
						for (var k in cache.vars) {
							root.style.setProperty(k, cache.vars[k]);
						}
					}
				} catch (e) {
					// Corrupt/unavailable cache — fall back to the default theme silently.
				}
			})();
		</script>
		<div id="app-root" style="display: contents">%sveltekit.body%</div>
		<p class="ssr-loading" aria-hidden="true">Loading...</p>
	</body>
</html>
